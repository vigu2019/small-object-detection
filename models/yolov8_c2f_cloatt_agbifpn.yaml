# YOLOv8 with C2fCloAtt backbone enhancement

nc: 10   # change based on dataset

backbone:
  - [ -1, 1, Conv,       [64, 3, 2] ]
  - [ -1, 1, Conv,       [128, 3, 2] ]
  - [-1, 3, C2fCloAtt, [128, 128]]
  - [ -1, 1, Conv,       [256, 3, 2] ]
  - [-1, 6, C2fCloAtt, [256, 256]]
  - [ -1, 1, Conv,       [512, 3, 2] ]
  - [-1, 6, C2fCloAtt, [512, 512]]
  - [ -1, 1, Conv,       [512, 3, 2] ]
  - [-1, 6, C2fCloAtt, [512, 512]]
  - [ -1, 1, SPPF,       [512, 5] ]


# ---------------- AGBiFPN Neck ----------------
neck:
  - [[6, 4, 2], 1, AGBiFPN, [256]]


head:
  - [[4, 6, 9], 1, Detect, [nc]]

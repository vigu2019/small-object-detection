# YOLOv8 with C2fCloAtt backbone enhancement

nc: 10   # change based on dataset

backbone:
  - [ -1, 1, Conv,       [64, 3, 2] ]
  - [ -1, 1, Conv,       [128, 3, 2] ]
  - [-1, 3, C2fCloAtt, [128, 128]]
  - [ -1, 1, Conv,       [256, 3, 2] ]
  - [-1, 6, C2fCloAtt, [256, 256]]
  - [ -1, 1, Conv,       [512, 3, 2] ]
  - [-1, 6, C2fCloAtt, [512, 512]]
  - [ -1, 1, Conv,       [512, 3, 2] ]
  - [-1, 6, C2fCloAtt, [512, 512]]
  - [ -1, 1, SPPF,       [512, 5] ]


neck:
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

head:
  - [[4, 6, 9], 1, Detect, [nc]]

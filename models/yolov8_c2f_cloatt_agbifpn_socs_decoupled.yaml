# YOLOv8 + C2fCloAtt backbone + AGBiFPN-SOCS neck + Decoupled head

nc: 10   # number of classes

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2fCloAtt, [128, 128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2fCloAtt, [256, 256]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fCloAtt, [512, 512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2fCloAtt, [512, 512]]
  - [-1, 1, SPPF, [512, 5]]

neck:
  - [-1, 1, AGBiFPN_SOCS, [256]]

head:
  - [-1, 1, DecoupledDetect, [nc]]
